<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Window Header Bar -->
  <rect width="800" height="48" rx="16" fill="#0A0F1D"/>
  <rect y="36" width="800" height="12" fill="#0A0F1D"/>
  <circle cx="28" cy="24" r="6" fill="#EF4444"/>
  <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="24" r="6" fill="#10B981"/>
  <text x="400" y="30" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    Healthcare Analytics Dashboard — Excel &amp; Power Query
  </text>

  <!-- KPI Top Cards -->
  <!-- Card 1 -->
  <rect x="30" y="70" width="170" height="90" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="45" y="96" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="500">Total Patient Visits</text>
  <text x="45" y="132" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700">Metrics</text>
  <circle cx="170" cy="115" r="14" fill="#0284C7" fill-opacity="0.2"/>
  <path d="M170 109v12M164 115h12" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>

  <!-- Card 2 -->
  <rect x="220" y="70" width="170" height="90" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="235" y="96" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="500">Avg Treatment Days</text>
  <text x="235" y="132" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700">Analytics</text>
  <path d="M355 125l8-14 6 6 8-10" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Card 3 -->
  <rect x="410" y="70" width="170" height="90" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="425" y="96" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="500">Department Count</text>
  <text x="425" y="132" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700">Transformed</text>
  <circle cx="550" cy="115" r="12" fill="#38BDF8" fill-opacity="0.15"/>
  <path d="M545 115h10M550 110v10" stroke="#38BDF8" stroke-width="2"/>

  <!-- Card 4: Tool Tag -->
  <rect x="600" y="70" width="170" height="90" rx="10" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-width="1"/>
  <text x="620" y="98" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="12" font-weight="700">CORE TOOLSET</text>
  <text x="620" y="124" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Excel Pivot Tables</text>
  <text x="620" y="144" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Power Query ETL</text>

  <!-- Left Main Visual: Pivot Bar Chart by Department -->
  <rect x="30" y="180" width="450" height="285" rx="12" fill="#131D33" stroke="#1E293B" stroke-width="1"/>
  <text x="50" y="212" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Patient Distribution by Medical Department</text>
  <text x="50" y="230" fill="#64748B" font-family="'Inter', sans-serif" font-size="11">Cleaned &amp; aggregated using Excel Pivot Tables</text>

  <!-- Grid Lines -->
  <line x1="50" y1="260" x2="450" y2="260" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="50" y1="310" x2="450" y2="310" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="50" y1="360" x2="450" y2="360" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="50" y1="410" x2="450" y2="410" stroke="#334155" stroke-width="1.5"/>

  <!-- Department Bars -->
  <!-- Cardiology -->
  <rect x="75" y="275" width="42" height="135" rx="4" fill="url(#barGrad1)"/>
  <text x="96" y="430" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Cardio</text>

  <!-- Neurology -->
  <rect x="145" y="305" width="42" height="105" rx="4" fill="url(#barGrad2)"/>
  <text x="166" y="430" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Neuro</text>

  <!-- Orthopedics -->
  <rect x="215" y="250" width="42" height="160" rx="4" fill="url(#barGrad1)"/>
  <text x="236" y="430" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Ortho</text>

  <!-- Pediatrics -->
  <rect x="285" y="325" width="42" height="85" rx="4" fill="url(#barGrad2)"/>
  <text x="306" y="430" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Pediatrics</text>

  <!-- General -->
  <rect x="355" y="280" width="42" height="130" rx="4" fill="url(#barGrad1)"/>
  <text x="376" y="430" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">General</text>

  <!-- Right Panel: Power Query Data Transformation Flow -->
  <rect x="500" y="180" width="270" height="285" rx="12" fill="#131D33" stroke="#1E293B" stroke-width="1"/>
  <text x="520" y="212" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Power Query ETL Pipeline</text>
  
  <!-- Step 1 -->
  <rect x="520" y="235" width="230" height="52" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <circle cx="538" cy="261" r="10" fill="#0284C7"/>
  <text x="538" y="265" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">1</text>
  <text x="558" y="255" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Raw Data Ingestion</text>
  <text x="558" y="272" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">CSV/Excel patient records</text>

  <!-- Step 2 -->
  <rect x="520" y="297" width="230" height="52" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <circle cx="538" cy="323" r="10" fill="#0284C7"/>
  <text x="538" y="327" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">2</text>
  <text x="558" y="317" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Data Cleansing</text>
  <text x="558" y="334" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Handle nulls, remove duplicates</text>

  <!-- Step 3 -->
  <rect x="520" y="359" width="230" height="52" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <circle cx="538" cy="385" r="10" fill="#10B981"/>
  <text x="538" y="389" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">3</text>
  <text x="558" y="379" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Pivot Dashboard</text>
  <text x="558" y="396" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Slicers, charts &amp; summaries</text>

  <rect x="520" y="423" width="230" height="26" rx="4" fill="#0284C7" fill-opacity="0.1"/>
  <text x="635" y="440" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">✓ Interactive Healthcare Dashboard</text>
</svg>

